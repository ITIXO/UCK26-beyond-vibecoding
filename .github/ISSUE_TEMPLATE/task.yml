name: Task template
description: Task for feature
labels: ["Task"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done and why. Be specific — this will be picked up and implemented by an AI agent.
      placeholder: |
        Implement X so that Y.
        Context: ...
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: All criteria must pass before this task is done.
      value: |
        - [ ] **Test coverage** — [replace with specifics: which test file, which cases, what to set up, what to assert. Example: "Add integration test in `WorksheetEndpointTests.cs`: POST entry → assert `AuditLog` row with `Action=Create` and correct `PerformedBy`."] Tests must pass. No new untested code paths. If no testable behavior, state why.
        - [ ] **Update README.md** — [replace with specifics: which section, what to add or change. Example: "Add `AuditLog` to the Database entities section."] If nothing changed that README documents, state why.
        - [ ] **Update CLAUDE.md** — [replace with specifics: which convention, structure, or file changed and what to document. Example: "Add `AuditLog.cs` and `AuditInterceptor.cs` to solution structure map under `Persistence/`."] If nothing changed, state why.
    validations:
      required: true
